name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

# Supersede superseded pull request runs, but never cancel a run on master
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Plain `npm ci`: `--ignore-scripts` would skip install hooks that `unrs-resolver` and
      # `@parcel/watcher` rely on to link their native bindings
      - run: npm ci

      # Build, ESLint, Prettier and tests, run sequentially by `npm-run-all ci:*`
      - run: npm run ci
