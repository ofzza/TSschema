name: Showroom

# Builds this repository's showroom with `showroom` (a devDependency), and publishes it to GitHub Pages, on every
# push to master (the latest release). Needs Settings › Pages › Source set to "GitHub Actions", and master allowed to
# deploy to the github-pages environment (see PUBLISH.md)
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds with `--trust`, running the repository's code (its showcases), so only in a job that can read the
  # repository and nothing else, with no credentials left in the checkout
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Plain `npm ci` (see ci.yml); its `prepare` script also builds `dist/`
      - run: npm ci

      - run: npx showroom build --trust

      - uses: actions/upload-pages-artifact@v5
        with:
          path: showroom

  # Deploys the built showroom, running none of the repository's code
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
